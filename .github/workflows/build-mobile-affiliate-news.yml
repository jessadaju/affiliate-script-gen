name: Build Mobile Affiliate News APK

on:
  push:
    branches:
      - mobile-affiliate-news-build
    paths:
      - 'mobile_affiliate_news/**'
      - '.github/workflows/build-mobile-affiliate-news.yml'
  pull_request:
    paths:
      - 'mobile_affiliate_news/**'
      - '.github/workflows/build-mobile-affiliate-news.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_affiliate_news

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.jessadaju .

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://shopee-affiliate-product-hunter.vercel.app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopee-affiliate-news-debug-apk
          path: mobile_affiliate_news/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
